# Weather + Season theme for the Homeview dashboard.
#
# Install: copy this file to /config/themes/weather-season.yaml, then
# Developer Tools -> YAML -> reload "Themes". The Homeview dashboard is
# already set to use this theme, so it applies as soon as the file is in
# place and themes are reloaded.
#
# What it does:
# - The sky follows weather.forecast_home, the season (from the month) and
#   day/night (sun.sun): sunny skies differ by season, plus cloudy, rain,
#   storm, snow, fog and clear-night skies, darkened after sunset.
# - Animated particles fall over the screen: snow, autumn leaves, spring
#   petals, rain streaks, twinkling stars, drifting clouds, fog.
# - A scene band sits along the bottom like the reference dashboard:
#   a snow bank in snow/winter, water in rain, a leaf pile in autumn.
# - Thunderstorms add a soft lightning flash.
# - Cards go glassy (translucent + blur) so the sky shows through.
# Pure CSS - no image downloads, nothing to host.
#
# v0.2.0: more theme coverage - accent/text/sidebar/switch variables
# (Seasonal Glass overrides the accents per period when it is active),
# plus a card-mod-root fallback sky behind the whole app shell.
weather-season:
  card-mod-theme: weather-season

  # Glassy cards so the sky shows through
  ha-card-background: rgba(13, 20, 36, 0.68)
  ha-card-backdrop-filter: blur(14px) saturate(1.25)
  ha-card-border-color: rgba(0, 229, 255, 0.14)
  ha-card-border-radius: 22px
  ha-card-box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45)
  app-header-background-color: rgba(7, 11, 22, 0.72)
  app-header-text-color: "#e6f7ff"
  primary-background-color: "#070b16"
  lovelace-background: "#070b16"

  # Accent fallbacks (Seasonal Glass overrides these per period when active)
  primary-color: "#00e5ff"
  accent-color: "#00b8d4"
  mdc-theme-primary: "#00e5ff"

  # Text
  primary-text-color: "#e6f7ff"
  secondary-text-color: "#9db4c8"
  disabled-text-color: "#5a6d80"

  # Surfaces
  secondary-background-color: "#0d1626"
  divider-color: "rgba(0, 229, 255, 0.12)"

  # Sidebar
  sidebar-background-color: "rgba(7, 11, 22, 0.88)"
  sidebar-text-color: "#c8dcea"
  sidebar-icon-color: "#7a93a8"
  sidebar-selected-background-color: "rgba(0, 229, 255, 0.14)"
  sidebar-selected-text-color: "#00e5ff"
  sidebar-selected-icon-color: "#00e5ff"

  # Controls
  switch-checked-color: "#00e5ff"
  switch-checked-track-color: "rgba(0, 229, 255, 0.35)"

  card-mod-view: |
    {% set w = states('weather.forecast_home') %}
    {% set month = now().month %}
    {% set season = 'winter' if month in [12, 1, 2] else 'spring' if month in [3, 4, 5] else 'summer' if month in [6, 7, 8] else 'autumn' %}
    {% set night = is_state('sun.sun', 'below_horizon') %}
    {% if w in ['sunny', 'partlycloudy'] %}
      {% if season == 'spring' %}
        {% set sky = 'linear-gradient(180deg, #79b8e8 0%, #a8d4f0 42%, #d9ecdf 78%, #f2ecd2 100%)' %}
      {% elif season == 'summer' %}
        {% set sky = 'linear-gradient(180deg, #4f9fe0 0%, #7fc0ee 45%, #cfe8f7 75%, #ffedb0 100%)' %}
      {% elif season == 'autumn' %}
        {% set sky = 'linear-gradient(180deg, #6fa8d8 0%, #a8c4de 40%, #e8b877 78%, #f5d49a 100%)' %}
      {% else %}
        {% set sky = 'linear-gradient(180deg, #9dbfd9 0%, #c3d8e8 45%, #e6eef4 78%, #f7fafc 100%)' %}
      {% endif %}
    {% elif w in ['cloudy', 'windy', 'windy-variant'] %}
      {% set sky = 'linear-gradient(180deg, #5d7186 0%, #7d93a8 50%, #a9b8c6 100%)' %}
    {% elif w in ['rainy', 'pouring', 'hail', 'exceptional'] %}
      {% set sky = 'linear-gradient(180deg, #2b394d 0%, #3f5470 55%, #5a7186 100%)' %}
    {% elif w in ['lightning', 'lightning-rainy'] %}
      {% set sky = 'linear-gradient(180deg, #1f2637 0%, #333d57 55%, #4c5a76 100%)' %}
    {% elif w in ['snowy', 'snowy-rainy'] %}
      {% set sky = 'linear-gradient(180deg, #aebfcd 0%, #cfd9e0 50%, #eef2f4 100%)' %}
    {% elif w == 'fog' %}
      {% set sky = 'linear-gradient(180deg, #8b979e 0%, #aab4ba 55%, #c9cfd2 100%)' %}
    {% elif w == 'clear-night' %}
      {% set sky = 'linear-gradient(180deg, #04081a 0%, #0b142e 55%, #1a2a52 100%)' %}
    {% else %}
      {% set sky = 'linear-gradient(180deg, #5d7186 0%, #7d93a8 50%, #a9b8c6 100%)' %}
    {% endif %}
    {% set ns = namespace(kind='none', band='none', flash=false) %}
    {% if w in ['snowy', 'snowy-rainy'] %}
      {% set ns.kind = 'snow' %}{% set ns.band = 'snowbank' %}
    {% elif w in ['rainy', 'pouring', 'hail', 'exceptional'] %}
      {% set ns.kind = 'rain' %}{% set ns.band = 'water' %}
    {% elif w in ['lightning', 'lightning-rainy'] %}
      {% set ns.kind = 'rain' %}{% set ns.band = 'water' %}{% set ns.flash = true %}
    {% elif w == 'clear-night' %}
      {% set ns.kind = 'stars' %}
      {% if season == 'winter' %}{% set ns.band = 'snowbank' %}{% endif %}
    {% elif w in ['cloudy', 'windy', 'windy-variant', 'partlycloudy'] %}
      {% set ns.kind = 'clouds' %}
      {% if season == 'autumn' %}{% set ns.band = 'leaves' %}
      {% elif season == 'winter' %}{% set ns.band = 'snowbank' %}{% endif %}
    {% elif w == 'fog' %}
      {% set ns.kind = 'mist' %}
    {% elif w == 'sunny' %}
      {% if season == 'autumn' %}{% set ns.kind = 'leaves' %}{% set ns.band = 'leaves' %}
      {% elif season == 'winter' %}{% set ns.kind = 'snow' %}{% set ns.band = 'snowbank' %}
      {% elif season == 'spring' %}{% set ns.kind = 'petals' %}
      {% endif %}
    {% endif %}
    @keyframes ws-snow { from { background-position: 0 -130px, 0 -190px, 0 -260px; } to { background-position: 30px 650px, -25px 760px, 45px 900px; } }
    @keyframes ws-leaves { 0% { background-position: 0 -240px, 0 -320px, 0 -300px; } 50% { background-position: 45px 300px, -35px 380px, 25px 340px; } 100% { background-position: 10px 760px, -10px 900px, 0 820px; } }
    @keyframes ws-petals { 0% { background-position: 0 -260px, 0 -340px; } 50% { background-position: 35px 320px, -30px 400px; } 100% { background-position: 5px 780px, -5px 920px; } }
    @keyframes ws-rain { from { background-position: 0 0, 0 0; } to { background-position: -70px 140px, -70px 140px; } }
    @keyframes ws-stars { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes ws-clouds { from { background-position: 0 0, 0 0; } to { background-position: 700px 0, -500px 0; } }
    @keyframes ws-mist { from { background-position: 0 0; } to { background-position: 900px 0; } }
    @keyframes ws-flash { 0%, 86%, 92%, 96%, 100% { opacity: 0; } 88% { opacity: .45; } 90% { opacity: .08; } 94% { opacity: .28; } }
    :host {
      background-image: {{ sky }};
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    hui-sections-view {
      background-image: {% if night %}linear-gradient(rgba(3, 6, 18, 0.5), rgba(3, 6, 18, 0.5)), {% endif %}{% if ns.band == 'snowbank' %}radial-gradient(ellipse 90% 70px at 50% 112%, rgba(255, 255, 255, 0.95) 55%, transparent 72%), radial-gradient(ellipse 60% 46px at 85% 108%, rgba(240, 244, 248, 0.9) 55%, transparent 72%), {% elif ns.band == 'water' %}linear-gradient(0deg, rgba(16, 52, 96, 0.95) 0 54px, rgba(32, 84, 140, 0.8) 54px 72px, transparent 72px), linear-gradient(0deg, transparent 0 70px, rgba(140, 200, 255, 0.4) 70px 73px, transparent 73px), {% elif ns.band == 'leaves' %}radial-gradient(ellipse 70% 56px at 20% 110%, rgba(180, 90, 30, 0.92) 55%, transparent 72%), radial-gradient(ellipse 60% 44px at 78% 108%, rgba(205, 125, 40, 0.88) 55%, transparent 72%), {% endif %}{{ sky }};
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    hui-sections-view::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      {% if ns.kind == 'snow' %}
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.95) 1.2px, transparent 1.8px), radial-gradient(circle, rgba(255, 255, 255, 0.8) 1.8px, transparent 2.4px), radial-gradient(circle, rgba(255, 255, 255, 0.65) 2.4px, transparent 3px);
      background-size: 130px 130px, 190px 190px, 260px 260px;
      animation: ws-snow 18s linear infinite;
      {% elif ns.kind == 'leaves' %}
      background-image: radial-gradient(5px 3px at 50% 50%, rgba(230, 126, 34, 0.9) 60%, transparent 72%), radial-gradient(4px 3px at 50% 50%, rgba(192, 57, 43, 0.85) 60%, transparent 72%), radial-gradient(4px 2.5px at 50% 50%, rgba(241, 196, 15, 0.85) 60%, transparent 72%);
      background-size: 200px 240px, 280px 320px, 360px 300px;
      animation: ws-leaves 16s linear infinite;
      {% elif ns.kind == 'petals' %}
      background-image: radial-gradient(circle, rgba(255, 183, 197, 0.9) 2px, transparent 2.6px), radial-gradient(circle, rgba(255, 255, 255, 0.85) 1.6px, transparent 2.2px);
      background-size: 220px 260px, 300px 340px;
      animation: ws-petals 22s linear infinite;
      {% elif ns.kind == 'rain' %}
      background-image: repeating-linear-gradient(105deg, transparent 0 12px, rgba(174, 194, 224, 0.5) 12px 13px, transparent 13px 28px), repeating-linear-gradient(105deg, transparent 0 20px, rgba(174, 194, 224, 0.3) 20px 21px, transparent 21px 46px);
      background-size: 140px 140px, 200px 200px;
      animation: ws-rain 0.55s linear infinite;
      {% elif ns.kind == 'stars' %}
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.95) 1px, transparent 1.5px), radial-gradient(circle, rgba(255, 255, 255, 0.7) 1.4px, transparent 2px);
      background-size: 140px 160px, 240px 200px;
      animation: ws-stars 5s ease-in-out infinite;
      {% elif ns.kind == 'clouds' %}
      background-image: radial-gradient(ellipse 220px 60px at 20% 20%, rgba(255, 255, 255, 0.14) 60%, transparent 70%), radial-gradient(ellipse 300px 80px at 70% 60%, rgba(255, 255, 255, 0.1) 60%, transparent 70%);
      background-size: 700px 500px, 700px 500px;
      animation: ws-clouds 120s linear infinite alternate;
      {% elif ns.kind == 'mist' %}
      background-image: radial-gradient(ellipse 400px 120px at 50% 40%, rgba(255, 255, 255, 0.16) 50%, transparent 70%);
      background-size: 900px 600px;
      animation: ws-mist 90s linear infinite alternate;
      {% else %}
      display: none;
      {% endif %}
    }
    hui-sections-view::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: #eaf2ff;
      {% if ns.flash %}animation: ws-flash 9s linear infinite;{% else %}display: none;{% endif %}
    }
    @media (prefers-reduced-motion: reduce) {
      hui-sections-view::after, hui-sections-view::before { animation: none !important; }
    }

  # Fallback sky on the app shell itself (hui-root), behind the view.
  # Same weather/season/night sky as the view, no particles - it only
  # shows where the view leaves the shell visible.
  card-mod-root: |
    {% set w = states('weather.forecast_home') %}
    {% set month = now().month %}
    {% set season = 'winter' if month in [12, 1, 2] else 'spring' if month in [3, 4, 5] else 'summer' if month in [6, 7, 8] else 'autumn' %}
    {% set night = is_state('sun.sun', 'below_horizon') %}
    {% if w in ['sunny', 'partlycloudy'] %}
      {% if season == 'spring' %}
        {% set sky = 'linear-gradient(180deg, #79b8e8 0%, #a8d4f0 42%, #d9ecdf 78%, #f2ecd2 100%)' %}
      {% elif season == 'summer' %}
        {% set sky = 'linear-gradient(180deg, #4f9fe0 0%, #7fc0ee 45%, #cfe8f7 75%, #ffedb0 100%)' %}
      {% elif season == 'autumn' %}
        {% set sky = 'linear-gradient(180deg, #6fa8d8 0%, #a8c4de 40%, #e8b877 78%, #f5d49a 100%)' %}
      {% else %}
        {% set sky = 'linear-gradient(180deg, #9dbfd9 0%, #c3d8e8 45%, #e6eef4 78%, #f7fafc 100%)' %}
      {% endif %}
    {% elif w in ['cloudy', 'windy', 'windy-variant'] %}
      {% set sky = 'linear-gradient(180deg, #5d7186 0%, #7d93a8 50%, #a9b8c6 100%)' %}
    {% elif w in ['rainy', 'pouring', 'hail', 'exceptional'] %}
      {% set sky = 'linear-gradient(180deg, #2b394d 0%, #3f5470 55%, #5a7186 100%)' %}
    {% elif w in ['lightning', 'lightning-rainy'] %}
      {% set sky = 'linear-gradient(180deg, #1f2637 0%, #333d57 55%, #4c5a76 100%)' %}
    {% elif w in ['snowy', 'snowy-rainy'] %}
      {% set sky = 'linear-gradient(180deg, #aebfcd 0%, #cfd9e0 50%, #eef2f4 100%)' %}
    {% elif w == 'fog' %}
      {% set sky = 'linear-gradient(180deg, #8b979e 0%, #aab4ba 55%, #c9cfd2 100%)' %}
    {% elif w == 'clear-night' %}
      {% set sky = 'linear-gradient(180deg, #04081a 0%, #0b142e 55%, #1a2a52 100%)' %}
    {% else %}
      {% set sky = 'linear-gradient(180deg, #5d7186 0%, #7d93a8 50%, #a9b8c6 100%)' %}
    {% endif %}
    :host {
      background-image: {% if night %}linear-gradient(rgba(3, 6, 18, 0.5), rgba(3, 6, 18, 0.5)), {% endif %}{{ sky }};
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
